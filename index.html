<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinayagar Seettu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h2>🛕 Vinayagar Seettu</h2></header>
<main class="container">
  <section id="listCard" class="card">
    <h2>Members</h2>
    <div class="summary"><b>Amount Holder:</b><span>Ranjith</span></div>
    <div class="summary"><b>Total Amount:</b><span>₹1700</span></div>
    <div id="memberList"></div>
    <p class="adminLink"><a href="/login.html">Admin</a></p>
  </section>

  <section id="details" class="card hidden">
    <h2 id="name"></h2>
    <p><b>Mobile:</b> <span id="mobile"></span></p>
    <p><b>Total Paid:</b> ₹<span id="total"></span></p>
    <table>
      <thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
    <button onclick="back()">⬅ Back</button>
  </section>
</main>

<script>
async function loadMembers(){
  const r=await fetch("/api/members"); const data=await r.json();
  memberList.innerHTML=data.map(m=>`<button class="memberBtn" onclick="showMember(${m.id})">${esc(m.name)}</button>`).join("");
}
function esc(s){return String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;");}
async function showMember(id){
  const r=await fetch(`/api/members/${id}`); const d=await r.json();
  listCard.classList.add("hidden"); details.classList.remove("hidden");
  name.textContent=d.member.name; mobile.textContent=d.member.mobile.replace(/(\d{5})(\d{5})/,"$1 $2");
  total.textContent=d.payments.reduce((a,p)=>a+Number(p.amount),0).toFixed(0);
  history.innerHTML=d.payments.length ? d.payments.map(p=>`
    <tr><td>${p.payment_date}</td><td>₹${p.amount}</td>
    <td><button class="paid-btn" onclick="viewBill(${p.id})">Paid 🧾 Bill</button></td></tr>`).join("")
    : `<tr><td colspan="3">Payment history இல்லை</td></tr>`;
}
function back(){details.classList.add("hidden");listCard.classList.remove("hidden");}
async function viewBill(id){
  const r=await fetch(`/api/payments/${id}`); const p=await r.json();
  const w=window.open("","_blank");
  if(!w){alert("Please allow pop-ups.");return;}
  w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${p.bill_no}</title><style>
  body{font-family:Arial;background:#f2f2f2;padding:20px}.bill{max-width:500px;margin:auto;background:white;padding:24px;border-radius:16px}
  h1{text-align:center;color:#ff6f00}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #ddd}
  .total{font-size:21px;font-weight:bold;text-align:right;margin-top:18px}.print{width:100%;padding:13px;margin-top:20px;background:#2196f3;color:white;border:0;border-radius:10px}
  img{max-width:100%;margin-top:15px;border-radius:10px}@media print{.print{display:none}}
  </style></head><body><div class="bill"><h1>🛕 Vinayagar Seettu</h1><h2 style="text-align:center">Payment Receipt</h2>
  <div class="row"><b>Member</b><span>${safe(p.member_name)}</span></div>
  <div class="row"><b>Mobile</b><span>${safe(p.mobile)}</span></div>
  <div class="row"><b>Date</b><span>${p.payment_date}</span></div>
  <div class="row"><b>Time</b><span>${p.payment_time}</span></div>
  <div class="row"><b>Amount</b><span>₹${p.amount}</span></div>
  <div class="row"><b>Payment Method</b><span>${p.payment_method}</span></div>
  ${p.transaction_id?`<div class="row"><b>UPI Transaction ID</b><span>${safe(p.transaction_id)}</span></div>`:""}
  ${p.google_transaction_id?`<div class="row"><b>Google Transaction ID</b><span>${safe(p.google_transaction_id)}</span></div>`:""}
  ${p.sender_name?`<div class="row"><b>From</b><span>${safe(p.sender_name)}</span></div>`:""}
  ${p.sender_upi?`<div class="row"><b>From UPI</b><span>${safe(p.sender_upi)}</span></div>`:""}
  ${p.receiver_name?`<div class="row"><b>To</b><span>${safe(p.receiver_name)}</span></div>`:""}
  ${p.receiver_upi?`<div class="row"><b>To UPI</b><span>${safe(p.receiver_upi)}</span></div>`:""}
  ${p.bank_name?`<div class="row"><b>Bank</b><span>${safe(p.bank_name)}</span></div>`:""}
  <div class="row"><b>Status</b><span>Paid</span></div><div class="row"><b>Bill No.</b><span>${p.bill_no}</span></div>
  ${p.screenshot_path?`<img src="${p.screenshot_path}" alt="Payment screenshot">`:""}
  <div class="total">Paid: ₹${p.amount}</div><button class="print" onclick="window.print()">🧾 Download / Save as PDF</button>
  </div></body></html>`);
  w.document.close();
}
function safe(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
loadMembers();
</script>
</body>
</html>
