function showMember(name){

document.querySelector(".card").style.display="none";
document.getElementById("details").style.display="block";

document.getElementById("memberName").innerHTML=name;
document.getElementById("mobile").innerHTML=data[name].mobile.replace(/(\d{5})(\d{5})/, "$1 $2");
document.getElementById("total").innerHTML=data[name].total;

let rows="";

data[name].history.forEach(x=>{
let status = x[2] === "Paid"
  ? `<button class="paid-btn" onclick="openBill('${name}','${x[0]}','${x[1]}')">Paid 🧾 Bill</button>`
  : x[2];

rows+=`
<tr>
<td>${x[0]}</td>
<td>₹${x[1]}</td>
<td>${status}</td>
</tr>`;
});

document.getElementById("history").innerHTML=rows;

}
  function back(){

document.querySelector(".card").style.display="block";
document.getElementById("details").style.display="none";

}


function openBill(name, date, amount){
  const mobile = data[name].mobile.replace(/(\d{5})(\d{5})/, "$1 $2");
  const billNo = "VS-" + date.replace(/\//g,"") + "-" +
                 name.replace(/\s+/g,"").slice(0,6).toUpperCase();

  const paymentMethod = {
  "Saravanan Abi":"Cash",
  "Ayyanar":"Cash",
  "Kumaresan":"Cash",
  "Kamal":"Cash"
}[name] || "Online";

  const bill = `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinayagar Seettu - Bill</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:20px}
.bill{max-width:500px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 2px 10px #bbb}
h1{text-align:center;color:#ff6f00;margin:0 0 8px}
h2{text-align:center;margin:0 0 22px;font-size:20px}
.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #ddd}
.total{font-size:21px;font-weight:bold;text-align:right;margin-top:18px}
.print{display:block;width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:13px;margin-top:22px;background:#2196f3;color:white;font-size:17px}
@media print{body{background:white;padding:0}.bill{box-shadow:none}.print{display:none}}
</style>
</head>
<body>
<div class="bill">
<h1>🏛️ Vinayagar Seettu</h1>
<h2>Payment Receipt</h2>
<div class="row"><b>Member</b><span>${name}</span></div>
<div class="row"><b>Mobile</b><span>${mobile}</span></div>
<div class="row"><b>Date</b><span>${date}</span></div>
<div class="row"><b>Amount</b><span>₹${amount}</span></div>
<div class="row"><b>Payment Method</b><span>${paymentMethod}</span></div>
<div class="row"><b>Payment Receiver</b><span>RanjithKumar</span></div>
<div class="row"><b>Status</b><span>Paid</span></div>
<div class="row"><b>Bill No.</b><span>${billNo}</span></div>
<div class="total">Paid: ₹${amount}</div>
<button class="print" onclick="window.print()">🧾 Print / Save as PDF</button>
</div>
</body>
</html>`;

  const win = window.open("", "_blank");
  if(!win){
    alert("Please allow pop-ups for this website, then tap Paid 🧾 Bill again.");
    return;
  }
  win.document.open();
  win.document.write(bill);
  win.document.close();
}
